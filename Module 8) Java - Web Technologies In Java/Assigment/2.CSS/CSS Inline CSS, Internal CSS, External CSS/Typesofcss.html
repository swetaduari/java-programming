<!DOCTYPE html>
<html>
<head>
  <title>CSS Types Example</title>

  <!-- 
    THEORY:

    Overview of CSS:
    CSS (Cascading Style Sheets) is used to style and design web pages.
    It controls colors, fonts, layouts, and spacing, making websites attractive and user-friendly.

    Types of CSS:

    1. Inline CSS:
       CSS applied directly inside HTML elements using the style attribute.

    2. Internal CSS:
       CSS written inside a <style> tag in the head section of the HTML document.

    3. External CSS:
       CSS written in a separate file and linked to the HTML using <link> tag.

    Lab Exercise:
    1. Create a webpage where:
       - Inline CSS is applied to an element.
       - Internal CSS is used for another element.
       - External CSS file is linked to style other elements.
  -->

  <!-- Internal CSS -->
  <style>
    .internal {
      color: blue;
      font-size: 20px;
    }
  </style>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <h1>CSS Types Demonstration</h1>

  <!-- Inline CSS Example -->
  <p style="color: red; font-weight: bold;">
    This paragraph uses Inline CSS.
  </p>

  <!-- Internal CSS Example -->
  <p class="internal">
    This paragraph uses Internal CSS.
  </p>

  <!-- External CSS Example -->
  <p class="external">
    This paragraph uses External CSS.
  </p>

</body>
</html>
